swagger: '2.0'
info:
  title: DevEx Efficiency Metrics Connector
  description: >-
    AI Agent for retrieving GitHub pull request metrics, team statistics, reviewer
    performance data, and Copilot review analytics. This helps analyze
    development team productivity, code review patterns, and collaboration
    metrics across repositories and teams.
  version: 1.0.0
host: your-devexmetrics-server
basePath: /
schemes:
  - https
paths:
  /:
    post:
      summary: DevEx Efficiency Metrics
      x-ms-agentic-protocol: mcp-streamable-1.0
      operationId: InvokeMCP
      responses:
        '200':
          description: Success
securityDefinitions:
  api_key:
    type: apiKey
    in: header
    name: x-api-key
security:
  - api_key: []